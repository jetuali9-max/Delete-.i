<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Learning Code</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- OPENING SCREEN -->
  <section id="opening" class="screen opening">
    <div class="languages">
      <span>HTML</span><span>JAVA</span><span>CSS</span><span>PYTHON</span>
    </div>

    <div class="hero">
      <div class="code-icon">&lt;/&gt;</div>
      <h1>Learning <b>Code</b></h1>
      <p>START YOUR CODING JOURNEY</p>
    </div>

    <div class="access-card">
      <div class="access-icon">⌘</div>
      <small>ACCESS CODE</small>
      <h2>Enter the code</h2>
      <p>Type the code below to continue</p>

      <div class="input-light">
        <input id="codeInput" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="ENTER CODE">
      </div>

      <button id="enterBtn">
        <span id="buttonText">ENTER</span>
        <i>→</i>
      </button>
      <div id="status"></div>
    </div>
  </section>

  <!-- NEXT SITE: revealed after the one-time crack transition -->
  <section id="mainSite" class="screen main-site">
    <div class="main-content">
      <div class="code-icon">&lt;/&gt;</div>
      <h1>Welcome to <b>Learning Code</b></h1>
      <p>Your coding journey starts here.</p>
      <div class="welcome-box">
        <strong>Ready to learn?</strong>
        <span>HTML • CSS • JavaScript • Python</span>
      </div>
    </div>
  </section>

  <!-- ONE-TIME SCREEN TRANSITION -->
  <div id="transition" class="transition" aria-hidden="true">
    <div class="crack-glow"></div>
    <div class="crack-line"></div>
    <div class="crack-edge left-edge"></div>
    <div class="crack-edge right-edge"></div>

    <div class="split-panel left-panel"></div>
    <div class="split-panel right-panel"></div>

    <div class="transition-word">ENTERING...</div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
