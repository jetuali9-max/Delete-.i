<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Learning Code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="languages" aria-label="Programming languages">
        <span>HTML</span>
        <span>JAVA</span>
        <span>CSS</span>
        <span>PYTHON</span>
      </div>

      <div class="rgb-orb orb-one"></div>
      <div class="rgb-orb orb-two"></div>
      <div class="rgb-orb orb-three"></div>

      <div class="title-wrap">
        <div class="mini-code">&lt;/&gt;</div>
        <h1>Learning <span>Code</span></h1>
        <p>Start your coding journey</p>
      </div>
    </section>

    <section class="unlock">
      <div class="panel">
        <div class="lock-icon">⌘</div>
        <p class="eyebrow">ACCESS CODE</p>
        <h2>Enter the code</h2>
        <p class="instruction">Type the code below to continue</p>

        <div class="code-display">
          <span>Required code</span>
          <strong>SANJID</strong>
        </div>

        <div class="input-wrap">
          <input id="codeInput" type="text" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" placeholder="ENTER CODE">
        </div>

        <button id="enterBtn" class="enter-btn" type="button">
          <span class="btn-text">ENTER</span>
          <span class="arrow">→</span>
          <span class="btn-glow"></span>
        </button>

        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="particles"></div>
  <script src="script.js"></script>
</body>
</html>
